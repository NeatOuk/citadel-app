name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Qt runtime libraries (offscreen QML test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - run: pip install PySide6
      - name: Tests (parity, daemon, integrity, QML, macOS parsers)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - run: python bin/citadel-daemon --selftest || true

  macos:
    runs-on: macos-15          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install PySide6
      - name: Tests, including the live macOS monitor checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - run: python bin/citadel-daemon --selftest
      - name: Daemon and CLI over the socket
        run: |
          python bin/citadel-daemon -v > daemon.log 2>&1 &
          start=$(date +%s)
          python -c "import socket,time; s=socket.create_connection(('1.1.1.1',443)); time.sleep(60)" &
          for i in $(seq 1 30); do
            sleep 1
            n=$(python bin/citadel call state 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin)['ticks'])" 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && break
          done
          echo "first tick after $(( $(date +%s) - start )) s"
          sleep 6
          python bin/citadel status
          python bin/citadel call state | python -c "import json,sys; d=json.load(sys.stdin); print('ticks', d['ticks'], 'conns', len(d['conns']), 'apps', len(d['apps']), 'monitorUp', d['monitorUp']); lv={}; [lv.__setitem__(a['trust'].get('level'), lv.get(a['trust'].get('level'),0)+1) for a in d['apps'].values()]; print('integrity levels', lv); print('to 1.1.1.1:', [c['app'] for c in d['conns'] if c['raddr']=='1.1.1.1'])"
          test "$(python bin/citadel call state | python -c "import json,sys; print(len(json.load(sys.stdin)['apps']))")" -gt 0
          kill %1 || true
          cat daemon.log
      - name: Capture raw tool output
        if: always()
        run: tests/macos/capture.sh macos-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-capture
          path: macos-capture/

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: CitadelCore parity with model.py / Model.js
        working-directory: macos/Packages/CitadelCore
        run: swift test
      - name: Build the host app and system extension (unsigned)
        working-directory: macos
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Citadel.xcodeproj -scheme CitadelHost -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
